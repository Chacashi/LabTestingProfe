name: Unity CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: Tests (editmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.10f1-editmode
          restore-keys: |
            Library-6000.3.10f1-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: '6000.3.10f1'
          projectPath: .
          testMode: editmode
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: editmode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-editmode
          path: ${{ steps.tests.outputs.artifactsPath }}

  playmode:
    name: Tests (playmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.10f1-playmode
          restore-keys: |
            Library-6000.3.10f1-
            Library-

      # PlayMode runs the game-ci CLI directly instead of using
      # game-ci/unity-test-runner@v4.
      #
      # Unity 6000.3.10f1 segfaults in ScriptingCoverage::FilterRecordedMethods
      # during the play-mode assembly reload when code coverage is enabled.
      # The action has no working way to turn coverage off: coverageEnabled: false
      # makes it emit --noCoverageEnabled, which the CLI rejects as an unknown
      # argument. The CLI itself does support --coverageEnabled=false.
      - name: Install game-ci CLI
        run: |
          set -euo pipefail
          CLI_VERSION=v0.1.69
          CLI_DIR="$RUNNER_TEMP/game-ci/$CLI_VERSION"
          if [ ! -x "$CLI_DIR/game-ci" ]; then
            mkdir -p "$CLI_DIR"
            curl -fsSL \
              "https://github.com/game-ci/cli/releases/download/$CLI_VERSION/game-ci-linux-x64.tar.gz" \
              -o "$CLI_DIR/cli.tar.gz"
            tar -xzf "$CLI_DIR/cli.tar.gz" -C "$CLI_DIR"
            rm -f "$CLI_DIR/cli.tar.gz"
            chmod +x "$CLI_DIR/game-ci"
          fi
          test -x "$CLI_DIR/game-ci"
          echo "$CLI_DIR" >> "$GITHUB_PATH"

      - name: Run PlayMode tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci test --docker --dockerShmSize=1025m --engine=unity . \
            --testPlatforms=playmode \
            --engineVersion=6000.3.10f1 \
            --coverageEnabled=false \
            --artifactsPath=playmode-artifacts \
            --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-playmode
          path: playmode-artifacts

  build:
    name: Build (StandaloneWindows64)
    needs: [editmode, playmode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the Library/ cache produced by the editmode job, so Unity does not
      # re-import the project from scratch. Falls back to a full import if the
      # cache is not available yet.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.10f1-build
          restore-keys: |
            Library-6000.3.10f1-editmode
            Library-6000.3.10f1-
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: '6000.3.10f1'
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildsPath: build
          customParameters: -nographics

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64

  # Only runs on tag pushes. A push to main is a moving branch pointer, not a
  # version, and a GitHub Release must be attached to a tag, so there is
  # nothing to publish for a plain branch push.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The artifact was uploaded from build/StandaloneWindows64, and
      # upload-artifact strips that common prefix, so the downloaded content
      # lands directly in the download path.
      - uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build/StandaloneWindows64

      - name: Create release zip
        run: |
          set -euo pipefail
          cd build/StandaloneWindows64
          zip -r "../Juego-${{ github.ref_name }}-Win64.zip" .
          cd ..
          ls -la
          unzip -l "Juego-${{ github.ref_name }}-Win64.zip" | head -20

      - uses: softprops/action-gh-release@v3
        with:
          files: build/Juego-${{ github.ref_name }}-Win64.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
