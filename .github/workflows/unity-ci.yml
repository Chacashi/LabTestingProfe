name: Unity CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: Tests (editmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.10f1-editmode
          restore-keys: |
            Library-6000.3.10f1-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: '6000.3.10f1'
          projectPath: .
          testMode: editmode
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: editmode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-editmode
          path: ${{ steps.tests.outputs.artifactsPath }}

  playmode:
    name: Tests (playmode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.10f1-playmode
          restore-keys: |
            Library-6000.3.10f1-
            Library-

      # PlayMode runs the game-ci CLI directly instead of using
      # game-ci/unity-test-runner@v4.
      #
      # Unity 6000.3.10f1 segfaults in ScriptingCoverage::FilterRecordedMethods
      # during the play-mode assembly reload when code coverage is enabled.
      # The action has no working way to turn coverage off: coverageEnabled: false
      # makes it emit --noCoverageEnabled, which the CLI rejects as an unknown
      # argument. The CLI itself does support --coverageEnabled=false.
      - name: Install game-ci CLI
        run: |
          set -euo pipefail
          CLI_VERSION=v0.1.69
          CLI_DIR="$RUNNER_TEMP/game-ci/$CLI_VERSION"
          if [ ! -x "$CLI_DIR/game-ci" ]; then
            mkdir -p "$CLI_DIR"
            curl -fsSL \
              "https://github.com/game-ci/cli/releases/download/$CLI_VERSION/game-ci-linux-x64.tar.gz" \
              -o "$CLI_DIR/cli.tar.gz"
            tar -xzf "$CLI_DIR/cli.tar.gz" -C "$CLI_DIR"
            rm -f "$CLI_DIR/cli.tar.gz"
            chmod +x "$CLI_DIR/game-ci"
          fi
          test -x "$CLI_DIR/game-ci"
          echo "$CLI_DIR" >> "$GITHUB_PATH"

      - name: Run PlayMode tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci test --docker --dockerShmSize=1025m --engine=unity . \
            --testPlatforms=playmode \
            --engineVersion=6000.3.10f1 \
            --coverageEnabled=false \
            --artifactsPath=playmode-artifacts \
            --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-playmode
          path: playmode-artifacts
